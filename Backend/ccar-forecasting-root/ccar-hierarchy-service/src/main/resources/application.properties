spring.application.name=ccar
server.port=8081
server.servlet.context-path=/ccar
spring.output.ansi.enabled=always

#KDB-VM Details
kdb.host=192.168.11.200
kdb.port=5173
kdb.username=test
kdb.password=test@123

#Logging
logging.level.com.forecast.ccar=INFO
logging.level.com.iris.kdb=INFO
# set to DEBUG to log method args/results (truncated) and KDB query text
#logging.level.com.forecast.ccar=DEBUG
logging.file.name=logs/ccar.log
# adds [correlationId] to every log line (console + file)
logging.pattern.level=%5p [%X{correlationId:-}]

#ccar-common AOP controller/service logging (LoggingAspect)
ccar.logging.enabled=true
ccar.logging.max-length=500

#KDB starter AOP query logging
kdb.logging.enabled=true
kdb.logging.slow-query-threshold-ms=1000

#Hierarchies (generic): GET /forecast/hierarchy/{type}, cached in memory; POST /forecast/hierarchy/{type}/reload
# Each type maps to a KDB table with columns <PREFIX>_ID, <PREFIX>_NAME, LEVEL_ID, PARENT_<PREFIX>_ID
# (column-prefix defaults to the type). Configured types are loaded at startup.
ccar.hierarchy.types.BU.table=BU_HIER
ccar.hierarchy.types.GEO.table=GEO_HIER
# any other type XYZ is served from table XYZ_HIERARCHY (if it exists in KDB) without a config entry
ccar.hierarchy.allow-unconfigured-types=true

# when a hierarchy load fails, its requests fail fast (503 + Retry-After) for this long before KDB is retried
ccar.hierarchy.retry-interval-ms=30000

#KDB connection pool: socket read timeout for login + every query (KdbTimeoutException -> HTTP 504)
kdb.query-timeout-millis=30000
kdb.max-wait-millis=5000

#Errors: Retry-After seconds sent with 503 data-store errors
ccar.errors.retry-after-seconds=30

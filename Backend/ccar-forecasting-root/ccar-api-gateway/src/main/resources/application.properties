spring.application.name=ccar-api-gateway

server.port=8089

# ---------------------------------------------------------------------------------------------------------
# Downstream services (override per environment, e.g. CCAR_GATEWAY_SERVICES_CCAR_CORE_URI)
# ---------------------------------------------------------------------------------------------------------
ccar.gateway.services.ccar-core.uri=http://localhost:8081
# KDB queries can be slow; must stay above ccar-core's kdb.query-timeout-millis so ccar-core can answer 504 itself
ccar.gateway.services.ccar-core.response-timeout-ms=35000
ccar.gateway.services.user-service.uri=http://localhost:8082
ccar.gateway.services.user-service.response-timeout-ms=10000

# Default HTTP client timeouts for all routes (per-route metadata below overrides the response timeout)
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=30s

# ---------------------------------------------------------------------------------------------------------
# Routes. Each route: circuit breaker with a problem+json fallback, and (for ccar-core) a retry of idempotent
# GETs on connection failures only (the request never reached the service). 4xx/5xx answers from a service are
# passed through untouched - they already use the shared error format.
# ---------------------------------------------------------------------------------------------------------
spring.cloud.gateway.routes[0].id=ccar
spring.cloud.gateway.routes[0].predicates=Path=/ccar/forecast/**
spring.cloud.gateway.routes[0].uri=${ccar.gateway.services.ccar-core.uri}
spring.cloud.gateway.routes[0].metadata.response-timeout=${ccar.gateway.services.ccar-core.response-timeout-ms}
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=ccar-core
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/ccar-core
spring.cloud.gateway.routes[0].filters[1].name=Retry
spring.cloud.gateway.routes[0].filters[1].args.retries=2
spring.cloud.gateway.routes[0].filters[1].args.methods=GET
spring.cloud.gateway.routes[0].filters[1].args.series=
spring.cloud.gateway.routes[0].filters[1].args.exceptions=java.net.ConnectException
spring.cloud.gateway.routes[0].filters[1].args.backoff.firstBackoff=100ms
spring.cloud.gateway.routes[0].filters[1].args.backoff.maxBackoff=500ms
spring.cloud.gateway.routes[0].filters[1].args.backoff.factor=2
spring.cloud.gateway.routes[0].filters[1].args.backoff.basedOnPreviousValue=false

spring.cloud.gateway.routes[1].id=ccar-user-service
spring.cloud.gateway.routes[1].uri=${ccar.gateway.services.user-service.uri}
spring.cloud.gateway.routes[1].predicates[0]=Path=/users,/users/**
spring.cloud.gateway.routes[1].metadata.response-timeout=${ccar.gateway.services.user-service.response-timeout-ms}
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=user-service
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/user-service

# Circuit breaker defaults (see ResilienceConfig). time-limit must exceed the longest response timeout + retries.
ccar.gateway.circuit-breaker.failure-rate-threshold=50
ccar.gateway.circuit-breaker.sliding-window-size=20
ccar.gateway.circuit-breaker.minimum-number-of-calls=10
ccar.gateway.circuit-breaker.wait-in-open-state=30s
ccar.gateway.circuit-breaker.time-limit=40s
# Retry-After sent with gateway-generated 503s
ccar.gateway.retry-after-seconds=30

#Logging (gateway log lines carry the correlation id as a [prefix]; WebFlux has no per-request MDC)
logging.level.com.ccar.ccar_api_gateway=INFO
logging.file.name=logs/ccar-api-gateway.log

spring.output.ansi.enabled=always


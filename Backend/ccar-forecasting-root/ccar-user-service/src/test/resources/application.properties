# Disable Eureka client registration/lookup in tests: unit and slice tests
# (@WebMvcTest, @DataJpaTest, plain Mockito tests) don't have a running
# Eureka server available, and shouldn't need one - this keeps the test
# suite fast and independent of any external process.
#eureka.client.enabled=false

# Don't run data.sql during tests: UserRepositoryTest (@DataJpaTest) should
# start from a clean, empty H2 instance and control its own fixture data,
# not be coupled to whatever seed rows happen to be in data.sql.
spring.sql.init.mode=never

spring.application.name=user-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql (seed data) after Hibernate creates the schema, not before.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Example of an externalized, @Value-driven setting (case study: configuration management)
app.user.password.min-length=8

# Eureka client registration (dynamic discovery): this service registers
# itself under spring.application.name so api-gateway and other services
# can resolve it by name instead of a hardcoded host:port.
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#eureka.instance.prefer-ip-address=true
eureka.client.enabled=false


spring.application.name=ccar-forecasting-service
server.port=8083
# all endpoints are under /ccar/v1/... (gateway route /ccar/v1/**)
server.servlet.context-path=/ccar
spring.output.ansi.enabled=always

#KDB-VM Details
kdb.host=192.168.11.200
kdb.port=5173
kdb.username=test
kdb.password=test@123
#KDB connection pool: socket read timeout for login + every query (KdbTimeoutException -> HTTP 504)
kdb.query-timeout-millis=30000
kdb.max-wait-millis=5000

# Logging: every line carries the request's correlation id (set by ccar-common's CorrelationIdFilter)
logging.level.com.ccar.forecasting=INFO
logging.level.com.iris.kdb=INFO
# set to DEBUG to log method args/results (truncated) and the generated q queries
#logging.level.com.ccar.forecasting=DEBUG
logging.file.name=logs/ccar-forecasting-service.log
logging.pattern.level=%5p [%X{correlationId:-}]

# ccar-common AOP controller/service logging (LoggingAspect)
ccar.logging.enabled=true
ccar.logging.max-length=500

#KDB starter AOP query logging
kdb.logging.enabled=true
kdb.logging.slow-query-threshold-ms=1000

# Retry-After sent with 503 responses (ccar-common GlobalExceptionHandler)
ccar.errors.retry-after-seconds=30

# ---------------------------------------------------------------------------------------------------------
# Forecast / actuals / variance data (see ForecastingProperties for the expected KDB table layout)
# ---------------------------------------------------------------------------------------------------------
ccar.forecasting.currency=USD
ccar.forecasting.all-portfolios-id=ALL
ccar.forecasting.period-count=36
ccar.forecasting.default-page-size=25
ccar.forecasting.max-page-size=500

# One fact table per data set, all with the same layout
ccar.forecasting.datasets.forecast.table=CCAR_FORECAST
ccar.forecasting.datasets.actuals.table=CCAR_ACTUALS
ccar.forecasting.datasets.variance.table=CCAR_VARIANCE
# portfolios and T0 dates are read from this table
ccar.forecasting.reference-table=CCAR_FORECAST

# Fact table columns
ccar.forecasting.fact.account-column=ACCOUNT_ID
ccar.forecasting.fact.portfolio-column=PORTFOLIO_ID
ccar.forecasting.fact.t0-date-column=T0_DATE
ccar.forecasting.fact.t0-column=T0
# period n (1..period-count) is column <prefix>n: T_1 .. T_36 (= T+n for forecast, T-n for actuals/variance)
ccar.forecasting.fact.period-column-prefix=T_

# Measures, in display order (accounts found in the data but not listed here are appended, measure = account id)
ccar.forecasting.accounts[0].id=210001
ccar.forecasting.accounts[0].measure=Balance
ccar.forecasting.accounts[1].id=400001
ccar.forecasting.accounts[1].measure=Revenue
ccar.forecasting.accounts[2].id=500001
ccar.forecasting.accounts[2].measure=Expense

# Hierarchies: table <TYPE>_HIERARCHY with <PREFIX>_ID, <PREFIX>_NAME, LEVEL_ID, <PREFIX>_ID_LEVEL1..n
# (column-prefix defaults to the type). fact-column = the fact-table column holding the node id (default <PREFIX>_ID).
ccar.forecasting.hierarchy.types.BU.table=BU_HIERARCHY
ccar.forecasting.hierarchy.types.BU.fact-column=BU_ID
ccar.forecasting.hierarchy.types.GEO.table=GEO_HIERARCHY
ccar.forecasting.hierarchy.types.GEO.fact-column=GEO_ID
